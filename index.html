<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>INTIP</title>
    <style>
      html, body {
        background-color: #f1f1f3;
      }
    </style>
    <meta name="description" content="인천대학교 학생들을 위한 팁을 담다" />
    <!-- 공유 관련 메타 태그-->
    <meta property="og:title" content="INTIP" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://intip.inuappcenter.kr/og/main.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="INTIP" />
    <meta
      property="og:description"
      content="인천대학교 학생들을 위한 팁을 담다"
    />
    <meta property="og:url" content="https://intip.inuappcenter.kr/" />
    <!-- iOS Safari 네이티브 Smart App Banner. 앱이 없으면 설치를, 있으면 '열기'를
         띄운다. `app-argument`에 지금 보고 있는 URL을 넣어야 '열기'로 진입했을 때
         앱이 같은 화면으로 갈 수 있다(앱 쪽 `+native-intent`가 이 URL을 받는다).
         Safari가 head를 파싱할 때 값이 있어야 하므로 인라인 스크립트로 바로 채운다.
         Safari가 아닌 iOS 브라우저·인앱 웹뷰는 이 메타를 무시하므로, 그쪽은
         커스텀 배너(`components/common/AppInstallBanner.tsx`)가 담당한다. -->
    <meta name="apple-itunes-app" content="app-id=6740070975" />
    <script>
      (function () {
        try {
          var meta = document.querySelector('meta[name="apple-itunes-app"]');
          if (meta) {
            meta.setAttribute(
              "content",
              "app-id=6740070975, app-argument=" + window.location.href,
            );
          }
        } catch (error) {
          /* 메타 갱신 실패해도 배너 자체는 뜬다(앱은 기본 화면으로 열림) */
        }
      })();
    </script>

<!--    네이버 검색 등록을 위한 태그-->
    <meta name="naver-site-verification" content="d21e463ea38d2db93ba9d1a7ae7cbba5da7dc29f" />

    <script>
      (function () {
        var STORAGE_KEY = "fcmToken";
        var EVENT_NAME = "intip:fcm-token";

        function normalizeToken(token) {
          if (typeof token !== "string") {
            return "";
          }

          return token.trim();
        }

        function dispatchToken(token) {
          var normalizedToken = normalizeToken(token);

          if (!normalizedToken) {
            return;
          }

          var payload = {
            token: normalizedToken,
            receivedAt: Date.now(),
          };

          try {
            localStorage.setItem(STORAGE_KEY, normalizedToken);
          } catch (error) {
            console.error("FCM 토큰 저장 실패", error);
          }

          window.__INTIP_FCM_BOOTSTRAP__ = payload;
          window.dispatchEvent(
            new CustomEvent(EVENT_NAME, {
              detail: payload,
            }),
          );
        }

        var initialToken = "";
        try {
          initialToken = localStorage.getItem(STORAGE_KEY);
        } catch (error) {
          console.warn("FCM 토큰 읽기 실패", error);
        }

        window.__INTIP_FCM_BOOTSTRAP__ = {
          token: normalizeToken(initialToken),
          receivedAt: Date.now(),
        };

        window.onReceiveFcmToken = dispatchToken;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
